services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    ports:
      - "5432:5432"
    volumes:
      - acme_pg:/var/lib/postgresql/data
      - ./backend/sql/init-extra-dbs.sql:/docker-entrypoint-initdb.d/02-test-db.sql

volumes:
  acme_pg:
