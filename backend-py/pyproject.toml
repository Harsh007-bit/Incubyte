[project]
name = "acme-pay-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.9.0",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "faker>=33.0.0",
]

[tool.vercel]
entrypoint = "app.server:app"
